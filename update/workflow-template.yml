# colvmn scheduled updates: copy to .github/workflows/colvmn-updates.yml in
# the site's repo. See colvmn's "Scheduled updates" page.
#
# Once a day it runs every scheduled job that is due; on each push to the
# main branch it runs every `on: push` job whose watched paths changed. Each
# job's change is committed (publish: direct) or put up as a PR (publish: pr),
# then pushed.
#
# Commits pushed with the workflow's own GITHUB_TOKEN don't start new workflow
# runs, so the runner's commits can't trigger it again. (A self-hosted runner
# pushing with other credentials would; watch's rules keep a job's own output
# from making it due either way.)

name: colvmn updates

on:
  schedule:
    - cron: "17 7 * * *"          # daily, 07:17 UTC
  push:
    branches: [main]              # the site's main branch
  workflow_dispatch:              # run by hand from the Actions tab

concurrency:
  group: colvmn-updates           # one run at a time; a second waits
  cancel-in-progress: false

permissions:
  contents: write                 # commit and push
  pull-requests: write            # publish: pr

jobs:
  update:
    runs-on: ubuntu-latest
    # Jobs that need credentials kept on your own machine run on a
    # self-hosted runner instead (private repos only), e.g.:
    # runs-on: [self-hosted, macstudio]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true        # colvmn is usually a submodule
          fetch-depth: 0          # watch compares against earlier commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commit identity
        run: |
          git config user.name "colvmn updates"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run due jobs
        env:
          GH_TOKEN: ${{ github.token }}                         # gh pr create
          # The runner's own key, for prompt jobs:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # AI Reviews (colvmn.json "aiReviews"), one per provider:
          # CLAUDE_REVIEW_KEY: ${{ secrets.CLAUDE_REVIEW_KEY }}
          # OPENAI_REVIEW_KEY: ${{ secrets.OPENAI_REVIEW_KEY }}
          # GEMINI_REVIEW_KEY: ${{ secrets.GEMINI_REVIEW_KEY }}
          # XAI_REVIEW_KEY: ${{ secrets.XAI_REVIEW_KEY }}
          # Each credential a job lists, by name (described in _credentials/):
          # STRIPE_READ_KEY: ${{ secrets.STRIPE_READ_KEY }}
          # Email notifications, if colvmn.json turns them on:
          # NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          # NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          # RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node colvmn/update.js --on push --push
          else
            node colvmn/update.js --push
          fi
